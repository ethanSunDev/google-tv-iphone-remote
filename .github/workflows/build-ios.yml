name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Check remote message framing
        run: |
          swiftc App/TVRemoteWire.swift Tests/RemoteWireChecks.swift -o "$RUNNER_TEMP/remote-wire-checks"
          "$RUNNER_TEMP/remote-wire-checks"
      - name: Build and package IPA
        run: |
          set -euo pipefail
          xcodebuild -project TVRemote.xcodeproj -scheme TVRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/tvremote-build" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/tvremote-build/Build/Products/Release-iphoneos/TVRemote.app"
          test -x "$app/TVRemote"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$app/Info.plist")" = '_androidtvremote2._tcp'
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/tvremote-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/tvremote-ipa/Payload/TVRemote.app"
          cd "$RUNNER_TEMP/tvremote-ipa"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/TVRemote.ipa"
          unzip -t "$GITHUB_WORKSPACE/TVRemote.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: TVRemote-unsigned
          path: TVRemote.ipa
          if-no-files-found: error
